<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Worktopus - 게시판 통합 제어 관리</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/manage.css}">
    <link rel="stylesheet" th:href="@{/css/homeHeader.css}">
</head>
<body>
<div class="layout">
    <!-- 1. 왼쪽 사이드바 영역 연동 -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- 2. 오른쪽 메인 콘텐츠 영역 -->
    <div class="layout__content">
        <!-- 공통 헤더 바 연결 -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- 실제 관리 폼 메인 페이지 -->
        <main class="manage-container">
            <h1 class="manage-title">프로젝트 관리 (팀장 전용)</h1>

            <!-- 상단 탭 메뉴 바 -->
            <div class="manage-tabs">
                <button class="tab-btn" th:onclick="|location.href='/projects/' + ${projectId} + '/manage'|">일반 관리</button>
                <button class="tab-btn" th:onclick="|location.href='/projects/' + ${projectId} + '/manage/members'|">팀원 관리</button>
                <button class="tab-btn" th:onclick="|location.href='/projects/' + ${projectId} + '/manage/invite'|">팀원 초대</button>
                <button class="tab-btn active" th:onclick="|location.href='/projects/' + ${projectId} + '/manage/boards'|">게시판 관리</button>
            </div>

            <!-- 프로젝트 전역 통합 게시글 통제 관리 구역 -->
            <div id="board-tab" class="tab-content active">
                <div class="content-header">
                    <h3>📝 프로젝트 게시글 통합 모니터링 관리</h3>
                    <p>작성자와 관계없이 현재 프로젝트 내부의 모든 게시글을 실시간 조회하고 수정 및 강제 소멸 조치를 제어합니다.</p>
                </div>

                <!-- 간이 통계 대시보드 구역 -->
                <div class="board-stats-wrapper">
                    <div class="stat-card">
                        <h4>전체 누적 게시글 수</h4>
                        <p id="totalPostsCount">0</p>
                    </div>
                </div>

                <!-- 👥 팀원별 필터 조작 컨트롤러 구역 -->
                <div class="member-filter-wrapper">
                    <span class="filter-label">👥 팀원별 모아보기 :</span>
                    <div id="memberFilterChips" class="member-chips-container" th:data-project-id="${projectId}">
                        <!-- 자바스크립트에 의해 팀원 필터 칩 버튼들이 동적으로 드로잉됩니다 -->
                    </div>
                </div>

                <!-- 통합 게시글 한 줄 리스트 데이터 테이블 구역 -->
                <div class="boards-table-wrapper">
                    <table>
                        <thead>
                        <tr>
                            <th class="col-post-title">게시글 제목 / 본문 내용 요약</th>
                            <th class="col-post-info">작성자 / 등록일 (조회수)</th>
<!--                            <th class="col-post-action">보안 통제 제어 파이프라인</th>-->
                        </tr>
                        </thead>
                        <tbody id="integratedPostTbody">
                        <!-- 자바스크립트 동적 조립 렌더러 주입 구역 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/manage/project-manage.js}"></script>
<script th:src="@{/js/manage/manage-board.js}"></script>
</body>
</html>
